name: cheffybites

services:
  postgis:
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${CHEFFY_DB_NAME:-cheffybites}
      POSTGRES_USER: ${CHEFFY_DB_USERNAME:-cheffybites}
      POSTGRES_PASSWORD: ${CHEFFY_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${CHEFFY_DB_PORT:-5432}:5432"
    volumes:
      - cheffybites-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${CHEFFY_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CHEFFY_MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - cheffybites-mailpit-data:/data
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  cheffybites-postgis-data:
  cheffybites-mailpit-data:
